schema_version: ores.compose.v1
project: pony-expres-desktop
allow_lazy_start: false
source:
  repository: https://github.com/pony-expres/poex-desktop-daemon.git
  commit: 65e614166fd462e537ef9a03865f9386e5d52e48
  checkout_dir: tmp/dev/poex-desktop-daemon
services:
  daemon:
    runtime: host
    build:
      - ["cargo", "build", "--release"]
    command: ["./target/release/poex-desktop-daemon"]
    environment:
      POEX_DESKTOP_ADDR: "127.0.0.1:8762"
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:8762/healthz"]
      interval_ms: 250
      timeout_ms: 1000
      retries: 20
