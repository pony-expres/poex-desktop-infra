name: generation-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generation-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.82
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.82.0"
          components: rustfmt,clippy
      - name: Format validator
        run: cargo +1.82.0 fmt --manifest-path tools/generation-contract/Cargo.toml -- --check
      - name: Clippy validator
        run: cargo +1.82.0 clippy --manifest-path tools/generation-contract/Cargo.toml -- -D warnings
      - name: Validate generation lifecycle contract
        run: cargo +1.82.0 run --manifest-path tools/generation-contract/Cargo.toml
