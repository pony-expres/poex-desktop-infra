name: desktop-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMMON_DESKTOP_REVISION: 21851fcb6ca59fe4cfe887d882dac78d90548ce4

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify immutable common and quota declarations
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.common_layer.repository' appliance.json)" = "ORESoftware/ores-common-desktop-infra"
          test "$(jq -r '.common_layer.status' appliance.json)" = "pinned"
          test "$(jq -r '.common_layer.revision' appliance.json)" = "$COMMON_DESKTOP_REVISION"
          jq -e '.promotion_gates.common_layer_pinned == true' appliance.json >/dev/null
          jq -e '.common_layer.capabilities | index("release-activation-policy") != null' appliance.json >/dev/null
          jq -e '.schema == "ores.desktop-quota-admission/v1" and .product == "pony-expres" and .authority == "common-layer" and .identity_source == "shared-auth" and .tier_limits_source == "shared-auth-pricing-tier" and .enforcement_point == "router-middleware-before-dispatch" and .local_counter_backend == "memory" and .jwt_live_counters == false and .quota_epoch_claim == true and .monotonic_admission_fence == true and .http_backpressure == true and .rpc_backpressure == true and .bounded_concurrency == true and .bounded_queue == true and .ingress_safety_only == true' quota-admission.json >/dev/null
          test "$(jq -c '.required_request_windows_seconds | sort' quota-admission.json)" = '[60,600,3600]'
          jq -e '.cluster_counter_backend == "redis" or .cluster_counter_backend == "durable-actor"' quota-admission.json >/dev/null

      - name: Require approved common desktop read credential
        shell: bash
        env:
          COMMON_READ_TOKEN: ${{ secrets.ORE_SOURCE_PAT || secrets.FLEET_GITHUB_READ_TOKEN || secrets.TEST_FLEET_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COMMON_READ_TOKEN"

      - name: Check out exact common desktop conformance authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.COMMON_DESKTOP_REVISION }}
          path: tmp/dev/ores-common-desktop-infra
          token: ${{ secrets.ORE_SOURCE_PAT || secrets.FLEET_GITHUB_READ_TOKEN || secrets.TEST_FLEET_READ_TOKEN }}
          persist-credentials: false

      - name: Verify exact common desktop revision
        run: test "$(git -C tmp/dev/ores-common-desktop-infra rev-parse HEAD)" = "$COMMON_DESKTOP_REVISION"

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          rustc --version
          cargo --version

      - name: Run shared Rust appliance conformance
        run: |
          cargo run --locked \
            --manifest-path tmp/dev/ores-common-desktop-infra/Cargo.toml \
            -p ores-common-desktop-conformance \
            --bin validate_appliance_contract \
            -- "$GITHUB_WORKSPACE"
