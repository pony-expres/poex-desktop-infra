name: desktop-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned common desktop infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: c98aee842535429bc07b5e4437a2fb84d8f00d25
          path: tmp/dev/ores-common-desktop-infra
          persist-credentials: false

      - name: Run pinned common desktop checker
        env:
          ORES_COMMON_DESKTOP_EXPECTED_REVISION: c98aee842535429bc07b5e4437a2fb84d8f00d25
        run: |
          cargo run --locked \
            --manifest-path tmp/dev/ores-common-desktop-infra/daemon/rust/Cargo.toml \
            --bin ores-common-desktop-consumer-check
      - name: Validate desktop appliance boundary
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "json"

          compose_path = ".ores-compose.yaml"
          abort "missing #{compose_path}" unless File.file?(compose_path)
          doc = YAML.safe_load(File.read(compose_path), permitted_classes: [], permitted_symbols: [], aliases: false)
          appliance = JSON.parse(File.read("appliance.json"))
          policy_path = appliance.fetch("hot_reload_policy")
          abort "hot reload policy path drifted" unless policy_path == "hot-reload-policy.json"
          policy = JSON.parse(File.read(policy_path))
          abort "wrong hot reload policy schema" unless policy["schema"] == "ores.desktop-hot-reload/v1"
          abort "hot reload policy product mismatch" unless policy["product"] == appliance["product"]
          defaults = policy.fetch("default")
          allowed_front = %w[none nginx haproxy caddy]
          allowed_routes = %w[beam native_atomic external_process wasm_generation nginx_worker_generation haproxy_runtime caddy_admin]
          allowed_middleware = %w[beam_hot_code process_generation wasm_generation declarative_only]
          abort "invalid front proxy" unless allowed_front.include?(defaults["front_proxy"])
          abort "invalid route backend" unless allowed_routes.include?(defaults["route_backend"])
          abort "invalid middleware reload mode" unless allowed_middleware.include?(defaults["middleware_code_reload"])
          abort "route drain timeout must be bounded" unless defaults["route_drain_timeout_ms"].is_a?(Integer) && defaults["route_drain_timeout_ms"].between?(1, 86_400_000)
          abort "old generation retention must be bounded" unless defaults["max_old_generations"].is_a?(Integer) && defaults["max_old_generations"].between?(1, 4)
          supported_front = policy.fetch("supported_front_proxies")
          supported_routes = policy.fetch("supported_route_backends")
          supported_middleware = policy.fetch("supported_middleware_code_reload")
          abort "unsupported/duplicate front proxy entry" unless supported_front.uniq == supported_front && supported_front.all? { |v| allowed_front.include?(v) } && supported_front.include?(defaults["front_proxy"])
          abort "unsupported/duplicate route backend entry" unless supported_routes.uniq == supported_routes && supported_routes.all? { |v| allowed_routes.include?(v) } && supported_routes.include?(defaults["route_backend"])
          abort "unsupported/duplicate middleware reload entry" unless supported_middleware.uniq == supported_middleware && supported_middleware.all? { |v| allowed_middleware.include?(v) } && supported_middleware.include?(defaults["middleware_code_reload"])
          case defaults["route_backend"]
          when "nginx_worker_generation"
            abort "nginx reload backend requires nginx front proxy" unless defaults["front_proxy"] == "nginx"
          when "haproxy_runtime"
            abort "HAProxy runtime backend requires haproxy front proxy" unless defaults["front_proxy"] == "haproxy"
          when "caddy_admin"
            abort "Caddy admin backend requires caddy front proxy" unless defaults["front_proxy"] == "caddy"
          end
          if defaults["proxy_managed_application_routes"]
            abort "proxy-managed routes require a proxy-owned route backend" unless %w[nginx_worker_generation haproxy_runtime caddy_admin].include?(defaults["route_backend"])
          end
          invariants = policy.fetch("invariants")
          abort "routing/middleware isolation invariant weakened" unless invariants["routing_middleware_separate_from_compute"] == true
          abort "route reload may not restart standalone server" unless invariants["route_change_restarts_standalone_server"] == false
          abort "route reload may not restart lambda workers" unless invariants["route_change_restarts_lambda_workers"] == false
          abort "arbitrary native middleware may not share router process" unless invariants["arbitrary_native_middleware_in_router_process"] == false
          abort "old generation draining must be bounded" unless invariants["bounded_old_generation_drain"] == true



          abort "wrong compose schema" unless doc["schema_version"] == "ores.compose.v1"
          abort "wrong appliance schema" unless appliance["schema"] == "ores.desktop-appliance/v1"

          common = appliance.fetch("common_layer")
          abort "common desktop repo identity drifted" unless common["repository"] == "ORESoftware/ores-common-desktop-infra"
          abort "common desktop checkout must stay under tmp/dev" unless common["checkout_dir"] == "tmp/dev/ores-common-desktop-infra"
          required_common_caps = %w[consumer-validation loopback-policy secret-file-policy cloudflare-policy update-policy process-lifecycle health-readiness structured-logging desktop-auth-shell mixed-compute-plane runtime-isolation stable-ingress cross-platform-packaging typed-mutation-auth middleware-executor-isolation runtime-adapter-abi immutable-deployment-bundle durable-generation-state desktop-event-stream conformance-suite hot-reload-backends]
          capabilities = common.fetch("capabilities")
          abort "common desktop capability set incomplete" unless (required_common_caps - capabilities).empty?

          gates = appliance.fetch("promotion_gates", {})
          case common["status"]
          when "awaiting-repository"
            abort "awaiting common repository must not have a revision" unless common["revision"].nil?
            abort "common layer promotion gate must remain false" unless gates["common_layer_pinned"] == false
            abort "stable channel cannot await common repository" if appliance["channel"] == "stable"
          when "pinned"
            revision = common["revision"].to_s
            abort "pinned common layer requires immutable 40-hex revision" unless revision.match?(/\A[0-9a-f]{40}\z/)
            abort "pinned common layer promotion gate must be true" unless gates["common_layer_pinned"] == true
          else
            abort "unknown common desktop layer status"
          end
          abort "unexpected public IP requirement" unless appliance.dig("host", "requires_public_ip") == false
          abort "cloudflare credentials may not live in repo" unless appliance.dig("cloudflare", "credentials_in_repo") == false
          abort "orchestrator must be ores-compose" unless appliance.dig("orchestrator", "engine") == "ores-compose"
          abort "canonical compose path drifted" unless appliance.dig("orchestrator", "config") == compose_path

          source = doc.fetch("source")
          commit = source.fetch("commit")
          abort "source commit must be immutable 40-hex" unless commit.match?(/\A[0-9a-f]{40}\z/)
          abort "checkout must live under tmp/dev" unless source.fetch("checkout_dir").start_with?("tmp/dev/")
          abort "source must be credential-free GitHub HTTPS" unless source.fetch("repository").match?(%r{\Ahttps://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git\z})

          daemon = doc.fetch("services").fetch("daemon")
          abort "daemon must use host runtime" unless daemon["runtime"] == "host"
          abort "daemon must build before start" unless daemon["build"] == [["cargo", "build", "--release"]]
          command = daemon.fetch("command")
          abort "daemon must run the built release binary directly" unless command.length == 1 && command.first.start_with?("./target/release/")
          abort "local compose must not start a public tunnel" if doc.fetch("services").key?("tunnel")

          rendered = File.read(compose_path)
          abort "non-loopback bind found" if rendered.include?("0.0.0.0") || rendered.include?("[::]")
          if daemon["healthcheck"]
            listen = appliance.dig("host", "daemon_listen")
            health = daemon.dig("healthcheck", "command").join(" ")
            abort "healthcheck must target the appliance loopback daemon" unless health.include?("http://#{listen}/")
          end

          if (component = Array(appliance["components"]).find { |c| c["name"] == "desktop-daemon" })
            repo = source.fetch("repository").sub(%r{\Ahttps://github\.com/}, "").sub(/\.git\z/, "")
            abort "desktop-daemon component repo/source mismatch" unless component["repo"] == repo
            abort "desktop-daemon component rev/source mismatch" unless component["rev"] == commit
          end

          public_config = appliance.dig("orchestrator", "public_config")
          mode = appliance.dig("cloudflare", "mode")
          ready = appliance.dig("cloudflare", "public_ingress_ready")
          origin_auth = appliance.dig("cloudflare", "origin_auth")

          case mode
          when "not-required"
            abort "not-required mode may not declare public config" unless public_config.nil?
            abort "not-required mode must not be public-ready" unless ready == false
            abort "not-required mode must be outbound-agent-only" unless origin_auth == "outbound-agent-only"
            abort "not-required mode origin must be null" unless appliance.dig("cloudflare", "origin").nil?
          when "gated"
            abort "gated mode may not declare public config" unless public_config.nil?
            abort "gated mode must not be public-ready" unless ready == false
            abort "gated mode requires a distinct remote-auth bridge" unless origin_auth == "dedicated-remote-auth-required"
            abort "gated mode must explain its blocker" if appliance.dig("cloudflare", "promotion_reason").to_s.empty?
          when "remotely-managed"
            abort "public mode must declare canonical public config" unless public_config == ".ores-compose.public.yaml"
            abort "remote-managed mode must be public-ready" unless ready == true
            abort "remote-managed mode requires dedicated remote auth" unless origin_auth == "dedicated-remote-auth"
            abort "tunnel token must be file-backed" unless appliance.dig("cloudflare", "token_source") == "file"
          else
            abort "unknown cloudflare mode"
          end

          if public_config.nil?
            abort "gated/not-required appliance may not ship a runnable public compose profile" if File.exist?(".ores-compose.public.yaml")
          end

          gates = appliance.fetch("promotion_gates", {})
          abort "daemon lockfile gate must be explicit" unless gates.key?("daemon_lockfile_committed")

          if appliance["product"] == "takoda"
            required = %w[TKDA_AGENT_URL TKDA_AGENT_ID TKDA_AGENT_TOKEN_FILE TKDA_LOCAL_CONTROL_TOKEN_FILE]
            inherited = daemon.fetch("inherit_env", [])
            abort "Takoda agent credential/identity contract incomplete" unless (required - inherited).empty?
          end
          RUBY
